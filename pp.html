		function dragElement(elmnt,x,y) {
		  var pos1 = x, pos2 = y, pos3 = 0, pos4 = 0;
		  if (document.getElementById(elmnt.id + "header")) {
			/* if present, the header is where you move the DIV from:*/
			document.getElementById(elmnt.id + "header").onmousedown = dragMouseDown;
		  } else {
			/* otherwise, move the DIV from anywhere inside the DIV:*/
			elmnt.onmousedown = dragMouseDown;
		  }

		  function dragMouseDown(e) {
			e = e || window.event;
			e.preventDefault();
			// get the mouse cursor position at startup:
			pos3 = e.clientX;
			pos4 = e.clientY;
			document.onmouseup = closeDragElement;
			// call a function whenever the cursor moves:
			document.onmousemove = elementDrag;
		  }

		  function elementDrag(e) {
			e = e || window.event;
			e.preventDefault();
			// calculate the new cursor position:
			pos1 = pos3 - e.clientX;
			pos2 = pos4 - e.clientY;
			pos3 = e.clientX;
			pos4 = e.clientY;
			// set the element's new position:
			elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
			elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
		  }

		  function closeDragElement() {
			/* stop moving when mouse button is released:*/
			document.onmouseup = null;
			document.onmousemove = null;
		  }
		}

  ///////////////////////////////////////////////////////////////////
  // Creates plane mesh

  function createPlane(w, h, position, rotation) {
    var material = new THREE.MeshBasicMaterial({
      color: 0x000000,
      opacity: 0.0,
      side: THREE.DoubleSide
    });
    var geometry = new THREE.PlaneGeometry(w, h);
    var mesh = new THREE.Mesh(geometry, material);
    mesh.position.x = position.x;
    mesh.position.y = position.y;
    mesh.position.z = position.z;
    mesh.rotation.x = rotation.x;
    mesh.rotation.y = rotation.y;
    mesh.rotation.z = rotation.z;
    return mesh;
  }

			function onMouseMove( event ) { 
			  // calculate mouse position in normalized device coordinates 
			  // (-1 to +1) for both components 
			 // mouse.x =  ( event.clientX - container.offsetLeft/ container.clientWidth ) * 2 - 1; 
			 // mouse.y = - ( event.clientY - container.offsetTop / container.clientHeight ) * 2 + 1; 
				mouse.x = ( ( event.clientX - container.offsetLeft ) / renderer.domElement.clientWidth ) * 2 - 1;
				mouse.y = - ( ( event.clientY - container.offsetTop ) / renderer.domElement.clientHeight ) * 2 + 1;
				mouseUsed=true;
				
				//console.log("aaaa"+container.offsetTop);
			}
